services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inscripcion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Bind to loopback only: the database must not be reachable from the LAN.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inscripcion"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Swagger__Enabled: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=inscripcion;Username=postgres;Password=postgres"
      Enrollment__MaxNextSemesterSubjects: "3"
      Enrollment__CurrentPeriod: "2026-2"
      Database__ApplyMigrationsOnStartup: "true"
      # Shared with MiniIdentityApi: same issuer, audience and signing key.
      Jwt__Issuer: "MiniIdentityApi"
      Jwt__Audience: "MiniIdentityApiUsers"
      Jwt__Key: "${JWT_KEY:?Define JWT_KEY (openssl rand -base64 48) before starting}"
    ports:
      # Loopback only: the API is consumed by the dev-server proxy on the same host.
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  pgdata:
